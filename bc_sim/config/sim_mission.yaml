# Loaded after bc_bringup/config/mission.yaml by sim_mission.launch.py (extra_params_file).
# Only what differs in the Gazebo + ArduCopter SITL simulation.

target_search:
  ros__parameters:
    camera_on_gimbal: false         # the Gazebo camera is FIXED to the airframe: apply roll/pitch
    max_tilt: 0.12
    camera_latency: 0.05            # gz_camera_relay restamps on arrival; render -> ROS is ~1 frame

qr_detector:
  ros__parameters:
    reference_save_path: "~/.ros/bc_sim_reference_qr.png"

